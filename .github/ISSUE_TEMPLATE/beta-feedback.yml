name: Beta feedback or idea
description: Something could be clearer, easier or better.
title: "[beta feedback] "
labels: ["beta", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas, rough edges, confusing words — all welcome. This issue is public.
  - type: input
    id: version
    attributes:
      label: Raiker build
      placeholder: 0.9.0-beta.1 (abc1234)
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or updates
        - Chat
        - Build
        - Design
        - Models and local AI
        - Voice
        - Tasks and schedule
        - Memory
        - Extensions and connections
        - Permissions and sandbox
        - Settings
        - Other
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What you were trying to do, and what would have made it better.
    validations:
      required: true
