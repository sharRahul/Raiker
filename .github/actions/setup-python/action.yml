# OPT-19 — the Python set-up every CI job repeated: the pinned interpreter and,
# where a job needs the package, an editable install with its dev extras. Local
# to this repository, so it is reviewed with the workflows that use it; its own
# action reference is pinned to a commit like every other.
#
# Checkout is not in here on purpose: a local action can only be read after the
# tree it lives in has been checked out, so each job still says so itself.
name: Set up Raiker's Python
description: Pinned Python 3.11, and optionally the package installed with its dev extras.
inputs:
  install:
    description: "'dev' installs Raiker editable with its dev extras; 'none' installs nothing."
    required: false
    default: "none"
  cache:
    description: "Passed to actions/setup-python's cache (empty for none)."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python
      # actions/setup-python v6.2.0 (Node 24 runtime)
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.11"
        cache: ${{ inputs.cache }}
    - name: Install package and dev dependencies
      if: inputs.install == 'dev'
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -e ".[dev]"
