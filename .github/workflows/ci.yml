name: CI

# TEMPORARILY PAUSED:
# GitHub Actions run limit/quota is exhausted.
# Use local validation gate documented in docs/LOCAL_VALIDATION_GATE.md.
# Restore pull_request/push triggers when Actions quota is available again.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy raiker apps tests
      - name: Test
        run: python -m pytest
