name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        # actions/setup-python v6.2.0 (Node 24 runtime)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Verify real httpx import
        run: |
          python -c "import httpx; print(httpx.__file__)"
      - name: Run tests
        run: |
          python -m pytest
      - name: Run ruff
        run: |
          python -m ruff check .
      - name: Run mypy
        run: |
          python -m mypy raiker apps tests
      - name: Compile sources
        run: |
          python -m compileall -q raiker apps tests
