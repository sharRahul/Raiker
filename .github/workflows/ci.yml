name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        # actions/setup-python v6.2.0 (Node 24 runtime)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Verify real httpx import
        run: |
          python -c "import httpx; print(httpx.__file__)"
      - name: Verify SQLCipher memory-security probe
        run: |
          python - <<'PY'
          from pathlib import Path

          from raiker.storage.sqlcipher_probe import probe_memory_security

          result = probe_memory_security(Path.cwd())
          print(
              "SQLCipher memory security:",
              result.reason_code,
              result.sqlcipher_version or "version unavailable",
          )
          if not result.supported:
              raise SystemExit(
                  "The Linux release host could not lock SQLCipher key-bearing pages: "
                  + result.reason_code
              )
          PY
      - name: Run tests
        run: |
          python -m pytest -vv --durations=25
        # The real platform probe above proves Linux page locking separately.
        # Running thousands of isolated stores with locking enabled makes the
        # suite roughly seven times slower and can exhaust the runner's memlock
        # allowance, which hides test progress instead of adding coverage. The
        # BUG-46 tests exercise enabled and fail-closed behavior directly.
        env:
          RAIKER_SQLCIPHER_MEMORY_SECURITY: "off"
      - name: Run ruff
        run: |
          python -m ruff check .
      - name: Run mypy
        run: |
          python -m mypy raiker apps tests
      - name: Compile sources
        run: |
          python -m compileall -q raiker apps tests

  native:
    # The sandbox runner is the only part of Raiker that is not Python, and it
    # is the part that builds the operating-system boundary. It is built and
    # tested on both platforms that have one, because a boundary that compiles
    # on the author's machine and nowhere else is not a boundary anyone ships.
    name: Native runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Show toolchain
        working-directory: native
        run: |
          rustc --version
          cargo --version
      - name: Check formatting
        working-directory: native
        run: cargo fmt --check
      - name: Lint
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: native
        run: cargo test --all
      - name: Build and install into the package
        run: python scripts/build_native_runner.py
