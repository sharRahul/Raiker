name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python and install the package
        uses: ./.github/actions/setup-python
        with:
          install: dev
          cache: pip
      - name: Verify real httpx import
        run: |
          python -c "import httpx; print(httpx.__file__)"
      # Documentation plans are intentionally compact, and historical image
      # evidence may be pruned. Run the navigability and authority contracts
      # explicitly: they validate canonical Markdown documents and executable
      # governance references without requiring removed screenshots.
      - name: Validate documentation contracts
        run: |
          python -m pytest -q tests/test_docs_consistency.py tests/test_governance_entry_paths.py
      # RAIKER-2025 — FTS5 is required and the runtime refuses a build
      # without it, so a wheel that lost FTS5 would fail every store test with
      # a less direct message. The floor is asserted here first, with the
      # versions the run actually loaded.
      - name: Verify the SQLCipher build and FTS5
        run: |
          python - <<'PY'
          from importlib.metadata import version

          from sqlcipher3 import dbapi2 as sqlcipher

          MIN_SQLCIPHER = (4, 19, 0)
          MIN_SQLITE = (3, 53, 4)
          connection = sqlcipher.connect(":memory:")
          cipher = connection.execute("PRAGMA cipher_version").fetchone()[0]
          print(
              "sqlcipher3", version("sqlcipher3"),
              "| SQLCipher", cipher,
              "| SQLite", sqlcipher.sqlite_version,
          )

          def parts(text):
              return tuple(int(part) for part in text.split()[0].split(".")[:3])

          if parts(cipher) < MIN_SQLCIPHER or parts(sqlcipher.sqlite_version) < MIN_SQLITE:
              raise SystemExit(
                  "SQLCipher or SQLite is older than the floor in pyproject.toml "
                  "(SQLCipher 4.19.0, SQLite 3.53.4)."
              )
          try:
              connection.execute("CREATE VIRTUAL TABLE probe USING fts5(text)")
              connection.execute("INSERT INTO probe VALUES ('relevance')")
              connection.execute(
                  "SELECT bm25(probe) FROM probe WHERE probe MATCH 'relevance'"
              ).fetchone()
          except Exception as exc:  # noqa: BLE001 - the message is the report
              raise SystemExit(
                  f"This SQLCipher build has no FTS5 with bm25(), which Raiker requires: {exc}"
              ) from None
          print("FTS5: available")
          PY

      - name: Verify SQLCipher memory-security probe
        run: |
          python - <<'PY'
          from pathlib import Path

          from raiker.storage.sqlcipher_probe import probe_memory_security

          result = probe_memory_security(Path.cwd())
          print(
              "SQLCipher memory security:",
              result.reason_code,
              result.sqlcipher_version or "version unavailable",
          )
          if not result.supported:
              raise SystemExit(
                  "The Linux release host could not lock SQLCipher key-bearing pages: "
                  + result.reason_code
              )
          PY
      # The suite itself runs in `python-tests`, three shards in parallel. One
      # job reached its 45-minute limit on a slow runner (CI run 39612791351);
      # every test file must still land in exactly one shard.
      - name: Every test file is in exactly one shard
        run: |
          python scripts/test_shard.py --check 3
      # BUG-205 — the job-wide variable above is what stopped CI from ever seeing
      # a failure that landed on every contributor running the suite the
      # documented way. `cipher_memory_security` is process-global and latches
      # one way, so a test that reads it back depends on what ran before it; the
      # variable meant nothing in the job ever turned it on, and the order
      # dependency was invisible. This step runs the posture file the way a
      # contributor does — same process, variable unset — so the gate sees what
      # they see.
      - name: Run the SQLCipher posture tests without the job-wide override
        run: |
          python -m pytest tests/test_sqlcipher_memory_security.py tests/test_memory_sqlcipher.py -vv
      # DEC-24 step 7 / CI-02 — a committed credential fails the change. Only
      # published key formats are matched; a deliberate fixture is excused in
      # .github/secret-scan-exceptions.json with an owner, reason and expiry.
      - name: Scan for committed credentials
        run: |
          python scripts/scan_secrets.py
      # DEC-24 step 7 — static analysis for security (ruff's Bandit rules). A
      # finding passes only under a reviewed entry in
      # .github/sast-exceptions.json with an owner, reason and expiry.
      - name: Static security analysis
        run: |
          python scripts/scan_sast.py
      - name: Run ruff
        run: |
          python -m ruff check .
      - name: Run mypy
        run: |
          python -m mypy raiker apps tests
      - name: Compile sources
        run: |
          python -m compileall -q raiker apps tests

  # The Python suite, split three ways by measured running time
  # (`scripts/test_shard.py`, weights in `tests/test_durations.json`). Each
  # shard runs serially exactly as the single job did; together they finish in
  # about a third of the time, well inside the limit the single job reached.
  python-tests:
    name: Python tests (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python and install the package
        uses: ./.github/actions/setup-python
        with:
          install: dev
          cache: pip
      - name: Install native sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Build native runner
        run: python scripts/build_native_runner.py
      - name: Run tests
        run: |
          python -m pytest -vv --durations=25 $(python scripts/test_shard.py ${{ matrix.shard }} 3)
        # Run with the product's own memory-security default. Fresh workspaces
        # are copied from a schema template (FIXED-1247), so the thousands of
        # isolated stores no longer pay the per-ALTER cost that once made the
        # suite seven times slower with locking on.

  # Wave 0 of the codebase optimisation review: a baseline taken the same way on
  # every run, so a simplification reports what it removed instead of estimating
  # it. Standard library only and git-tracked files only; it measures and never
  # fails a change for being large. The report is kept as an artifact.
  source-measurement:
    name: Source measurement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python
        uses: ./.github/actions/setup-python
      - name: Measure handwritten source
        run: |
          python scripts/measure_loc.py --json loc-report.json
      - name: Keep the report
        # actions/upload-artifact v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: loc-report
          path: loc-report.json
          retention-days: 90

  # CR-12 — the review found CI with least-privilege permissions already, and no
  # gate for a dependency with a published vulnerability. This is that gate for
  # the Python side (the web workflow audits the npm lockfile). It audits the
  # runtime dependency set `pyproject.toml` declares, resolved fresh, so a new
  # advisory against anything an installed Raiker would load fails the change
  # that is running when it lands, and names the package.
  supply-chain:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python
        uses: ./.github/actions/setup-python
      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"
      # GCR-41 — the release builds from `requirements/release*.txt`, which are
      # exports of `uv.lock`. A change to `pyproject.toml` that is not locked, or
      # a lock that is not exported, fails here rather than at release time.
      - name: Check the release constraints match the lock
        run: |
          python -m pip install "uv==0.12.24"
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            -o requirements/release.txt
          uv export --frozen --no-dev --no-emit-project --extra dev --format requirements-txt \
            -o requirements/release-build.txt
          git diff --exit-code -- requirements/ || {
            echo "requirements/ is stale: re-run the two uv export commands in its header" >&2
            exit 1
          }
      - name: Audit the runtime dependencies
        run: |
          python - <<'PY' > runtime-requirements.txt
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              for requirement in tomllib.load(handle)["project"]["dependencies"]:
                  print(requirement)
          PY
          python -m pip_audit --progress-spinner off -r runtime-requirements.txt
      # GCR-41 — and the exact versions a release ships, which since the lock
      # are not necessarily the newest the ranges above admit.
      - name: Audit the locked release set
        run: |
          python -m pip_audit --progress-spinner off --disable-pip --require-hashes \
            -r requirements/release.txt

  windows-lifecycle:
    # BUG-312 — one local Windows run of this pair ended in a truncated
    # interpreter crash dump that has not reproduced since. Every other job runs
    # on Linux, so nothing would catch it again. This runs the pair on Windows
    # under the fault handler, several times, and keeps every complete dump.
    name: Windows lifecycle tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python and install the package
        uses: ./.github/actions/setup-python
        with:
          install: dev
          cache: pip
      - name: Run the pair under the fault handler
        shell: bash
        run: |
          for run in 1 2 3; do
            echo "::group::run $run"
            python -X faulthandler -m pytest -q -p no:cacheprovider               tests/test_instance_runtime_lifecycle.py tests/test_windows_internal_paths.py
            echo "::endgroup::"
          done
      # BR-D02 — target binding, worktrees and provenance must hold on Windows
      # as well as Linux. These drive real git repositories, worktrees and the
      # command store, so a path or line-ending assumption fails here first.
      - name: Build target, worktree and provenance tests
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_build_target_and_review.py tests/test_build_provenance_and_worktrees.py tests/test_build_fault_boundaries.py tests/test_build_outcome.py tests/test_build_cancel_mid_turn.py tests/test_build_task_target.py

  remote-access:
    # BUG-347 / BUG-358 — who can reach Raiker is decided by sockets, TLS and
    # file modes, which differ by platform: Unix sockets do not exist on
    # Windows, IPv6 loopback and socket permissions differ on macOS. The full
    # suite runs on Linux; these run the remote-access, MFA-session and
    # listener tests (real servers, TLS and the restart path included) on the
    # other two supported platforms.
    name: Remote access (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python and install the package
        uses: ./.github/actions/setup-python
        with:
          install: dev
          cache: pip
      - name: Remote access, listener and MFA-session tests
        shell: bash
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_remote_access.py tests/test_remote_auth.py tests/test_proxied_loopback.py tests/test_api_rest_hardening.py

  native:
    # The sandbox runner is the only part of Raiker that is not Python, and it
    # is the part that builds the operating-system boundary. It is built and
    # tested on both platforms that have one, because a boundary that compiles
    # on the author's machine and nowhere else is not a boundary anyone ships.
    name: Native runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Show toolchain
        working-directory: native
        run: |
          rustc --version
          cargo --version
      - name: Install Bubblewrap for native enforcement tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Check formatting
        working-directory: native
        run: cargo fmt --check
      - name: Lint
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: native
        run: cargo test --all --no-fail-fast
      - name: Show Seatbelt denials
        # Diagnostic only: the failing test step above still fails the job.
        if: failure() && runner.os == 'macOS'
        run: |
          log show --last 15m --style compact --predicate 'sender == "Sandbox"' | grep -E 'Sandbox: (cat|sh|bash|runner|raiker[^ ]*)\(' | tail -n 300
      - name: Build and install into the package
        run: python scripts/build_native_runner.py

  web:
    # GCR-15 — the web client is compiled and its mocked end-to-end suite run on
    # every change, not only on `web/**`: the backend produces the contracts it
    # reads, so a route or read-model change is a change to it too.
    name: Web UI (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Node
        # actions/setup-node v5.0.0 (Node 24 runtime)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      # CR-12 — a dependency with a published advisory fails the pull request
      # that would ship it, rather than being found later by hand. Every
      # package counts, not only runtime ones: the compiler and bundler are
      # devDependencies here and still decide what the shipped bundle contains.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      # BUG-41 — the mocked end-to-end suite runs against the build produced by
      # the step above. It needs no credential and no network: every API call is
      # answered from a fixture inside the spec. The `live` project, which drives
      # a real host holding real provider keys, is deliberately not run here —
      # CI has no key, and a suite that cannot really pass must not report that
      # it did.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end (mocked)
        run: npm run test:e2e:mocked

  desktop:
    # DESK-13 — the desktop window held to the web app's bar: audit, lint,
    # type-check, unit tests and the Electron end-to-end suite against a fixture
    # page. No Raiker host and no credential.
    name: Electron shell
    defaults:
      run:
        working-directory: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Node
        # actions/setup-node v5.0.0 (Node 24 runtime)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install the libraries Electron needs on a bare runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: End-to-end (shell)
        run: xvfb-run -a npx playwright test --project=shell

  licensing:
    name: Licensing and SBOM
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.0.1 (Node 24 runtime)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
        with:
          fetch-depth: 0
      - name: Set up Python and install the package
        uses: ./.github/actions/setup-python
        with:
          install: dev
      - name: Install the build tool
        run: python -m pip install --upgrade build
      - name: Install web dependencies from lockfile
        run: npm --prefix web ci
      - name: Validate licences and generate SPDX SBOM
        run: python scripts/licensing_check.py --sbom artifacts/licensing/raiker.spdx.json
      # CI-03 — the SBOM is kept with the run that produced it rather than
      # discarded; a release carries its own, bound to its artifacts.
      - name: Keep the SBOM with this run
        # actions/upload-artifact v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: sbom-spdx
          path: artifacts/licensing/raiker.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Build and validate distributions
        run: |
          python -m build
          python scripts/licensing_check.py --dist-dir dist

  build-faults:
    # BR-D06 — a real `raiker-web` with only the model scripted, killed with
    # SIGKILL while a Build turn's declared check runs, then started again on the
    # same workspace (`scripts/build_restart_fault.py`). Two variants: only the
    # host dies (the check is taken back over and the outcome follows its real
    # exit), and the host and the check both die (never verified). No credential.
    name: Build faults (host killed mid-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python and install the package
        uses: ./.github/actions/setup-python
        with:
          install: dev
          cache: pip
      - name: Install native sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Build native runner
        run: python scripts/build_native_runner.py
      - name: Kill the host mid-check and read the outcome
        run: python scripts/build_restart_fault.py --report build-restart-fault.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: build-restart-fault
          path: build-restart-fault.json
          if-no-files-found: warn
          retention-days: 14
