name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Verify test collection
        run: |
          python -m pytest --collect-only -q
      - name: Phase tests
        run: |
          python -m pytest -q tests/test_phase_*.py
      - name: API tests
        run: |
          python -m pytest -q tests/test_api_*.py
      - name: Runtime authority tests
        run: |
          python -m pytest -q tests/test_*runtime*.py tests/test_*authority*.py tests/test_*capability*.py
      - name: Docs truth tests
        run: |
          python -m pytest -q tests/test_*docs*.py tests/test_*truth*.py
      - name: All tests
        run: |
          python -m pytest -q -x --tb=short
      - name: Run ruff
        run: |
          python -m ruff check .
      - name: Run mypy
        run: |
          python -m mypy raiker apps tests
      - name: Compile sources
        run: |
          python -m compileall -q raiker apps tests
