name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  inventory-test-model-provider:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory remaining built-in test model provider references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          pattern="mock""-test|mock""-deterministic|deterministic""-test|Deterministic""TestProvider|Mock""ModelProvider|RAIKER""_TEST_MODE|allow""_test_provider"
          git grep -n -E "$pattern" -- . ':(exclude).github/workflows/ci.yml' | sed -n '46,180p' || true
          exit 1

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Verify real httpx import
        run: |
          python -c "import httpx; print(httpx.__file__)"
      - name: Verify test collection (fail fast on broken imports)
        run: |
          python -m pytest --collect-only -q
      - name: Run tests
        run: |
          python -m pytest
      - name: Run ruff
        run: |
          python -m ruff check .
      - name: Run mypy
        run: |
          python -m mypy raiker apps tests
      - name: Compile sources
        run: |
          python -m compileall -q raiker apps tests
