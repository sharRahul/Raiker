# SPDX-License-Identifier: Apache-2.0
name: Licensing

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  licensing:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install Python package and build tool
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
      - name: Install web dependencies from lockfile
        run: npm --prefix apps/web ci
      - name: Validate licences and generate SPDX SBOM
        run: python scripts/licensing_check.py --sbom artifacts/licensing/raiker.spdx.json
      - name: Build and validate distributions
        run: |
          python -m build
          python scripts/licensing_check.py --dist-dir dist
      - name: Validate DCO sign-offs
        if: github.event_name == 'pull_request'
        run: python scripts/check_dco.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
