# SPDX-License-Identifier: Apache-2.0
name: Licensing

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  licensing:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.0.1 (Node 24 runtime)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      # actions/setup-python v6.2.0 (Node 24 runtime)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install Python package and build tool
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
      - name: Install web dependencies from lockfile
        run: npm --prefix apps/web ci
      - name: Validate licences and generate SPDX SBOM
        run: python scripts/licensing_check.py --sbom artifacts/licensing/raiker.spdx.json
      - name: Build and validate distributions
        run: |
          python -m build
          python scripts/licensing_check.py --dist-dir dist
