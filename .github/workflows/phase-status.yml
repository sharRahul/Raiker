name: Phase Status Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase-status:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v5.0.1 (Node 24 runtime)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        # actions/setup-python v6.2.0 (Node 24 runtime)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Validate phase/status ledger
        run: python scripts/validate_phase_status.py
