name: Phase Status Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate phase/status ledger
        run: python scripts/validate_phase_status.py
