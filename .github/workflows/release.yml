# BUG-44 — the signed release, as a workflow you start on purpose.
#
# Everything the release *decides* lives in `raiker/app/release.py` and
# `raiker/app/desktop_release.py` and is covered by their tests; this file is
# the part that can only exist here — a machine of each target OS (through
# `desktop-package.yml`), and the signing identities.
#
# It is `workflow_dispatch` only. A release is a deliberate act, and a pipeline
# that could publish from a push is a pipeline that will eventually publish
# something nobody chose to.
#
# **The honesty rule.** `signing: require` is the default and fails a target
# whose identity secrets are absent, rather than producing an artifact that
# looks like a release. `signing: skip` is the way to exercise the pipeline
# without identities: it records `signing.applied = false` inside every build
# so the installed product says so, and may publish only as a beta draft.
# `signing: require-except-macos` (IN-3, 2026-11-07) signs Windows and Linux
# and builds macOS unsigned until an Apple Developer ID exists; it may publish
# only as a beta draft and its notes say which platform is unsigned. The
# Windows beta certificate is self-signed: Windows checks the file has not
# changed but names no trusted publisher, and Settings says exactly that.
# Filenames name the platform only; whether a build was signed is in the
# build, its manifest and the release notes, not its name.
#
# **One download per platform.** A draft release carries exactly five files —
# Windows x86-64 and Arm, macOS Apple silicon, Linux x86-64 and Arm — chosen by
# `raiker.app.desktop_release.release_asset_names`. The other installer formats
# are still built, installed and tested on every run and stay in the workflow
# artifacts, with the manifests, checksums and the signed channel.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, exactly X.Y.Z"
        required: true
        type: string
      channel:
        description: "Update channel the index is published under"
        default: stable
        type: choice
        options: [stable, beta]
      signing:
        description: "require = fail without identities; require-except-macos = sign Windows and Linux, macOS unsigned (beta only); skip = unsigned test build"
        default: require
        type: choice
        options: [require, require-except-macos, skip]
      publish:
        description: "Create a draft GitHub release from the signed artifacts"
        default: false
        type: boolean
      notes:
        description: "What this release changes (at most 4000 characters); signed into the channel index and shown in Settings, Updates"
        default: ""
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "24"

jobs:
  # ── 1. Is this release even coherent, and what does it consist of? ──────
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python
        # actions/setup-python v6.2.0 (Node 24 runtime)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package
        run: python -m pip install -e .
      - name: Refuse a version the updater could not compare
        run: |
          python - <<'PY'
          import os, sys
          from raiker.app.update import UpdateError, version_key
          version = os.environ["VERSION"]
          try:
              version_key(version)
          except UpdateError as exc:
              sys.exit(f"refused: {version!r} is not X.Y.Z ({exc})")
          print(f"releasing {version}")
          PY
        env:
          VERSION: ${{ inputs.version }}
      - name: Refuse to publish an unsigned build
        if: inputs.publish && inputs.signing != 'require' && inputs.channel != 'beta'
        run: |
          echo "refused: a build with any unsigned platform may only be published as a beta draft." >&2
          exit 1
      # Release gate — a release must be made from a commit that passed the
      # complete beta-critical suite, not merely the sandbox runner tests.
      # Each name is a GitHub Actions check from CI or llama.cpp engine CI.
      # The desktop workflow below rebuilds, installs and validates the signed
      # candidate itself, so it is deliberately not a prerequisite here.
      - name: Refuse a commit whose required verification did not pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          required = {
              "Python 3.11",
              "Python tests (shard 1 of 3)",
              "Python tests (shard 2 of 3)",
              "Python tests (shard 3 of 3)",
              "Source measurement",
              "Dependency vulnerabilities",
              "Windows lifecycle tests",
              "Remote access (windows-latest)",
              "Remote access (macos-15)",
              "Web UI (Node 24)",
              "Electron shell",
              "Licensing and SBOM",
              "Build faults (host killed mid-check)",
              "Data safety drills",
              "Engine tests (ubuntu-24.04)",
              "Engine tests (macos-15)",
              "Engine tests (windows-latest)",
              "Live install and inference (ubuntu-24.04)",
              "Live install and inference (macos-15)",
              "Live install and inference (windows-latest)",
              *{f"Native runner ({os_})" for os_ in
                ("ubuntu-24.04", "windows-2025", "macos-15", "macos-15-intel")},
          }
          # Only GitHub Actions' own check runs count: another app with
          # checks:write could post a run under the same name. A job re-run
          # adds a newer run, so the latest one per name decides; an old pass
          # never outlives a later failure.
          out = subprocess.run(
              ["gh", "api", "--paginate",
               f"repos/{os.environ['GH_REPO']}/commits/{os.environ['SHA']}/check-runs?filter=all",
               "--jq", ".check_runs[] | [.name, .app.slug, .id, .conclusion]"],
              check=True, capture_output=True, text=True).stdout
          latest = {}
          for name, app, run_id, conclusion in map(json.loads, out.splitlines()):
              if app != "github-actions" or name not in required:
                  continue
              if name not in latest or run_id > latest[name][0]:
                  latest[name] = (run_id, conclusion)
          passed = {name for name, (_, conclusion) in latest.items()
                    if conclusion == "success"}
          missing = sorted(required - passed)
          if missing:
              sys.exit("refused: required release verification has not passed on this "
                       "commit: " + ", ".join(missing))
          print("all required release verification passed on this commit")
          PY

  # ── 2. The desktop installers, built, installed and tested per target ─
  # DIST-01/DIST-11 — what an owner downloads is the desktop package: the
  # window with the host frozen inside it, so the machine needs no Python.
  # `desktop-package.yml` builds it on each platform's own runner, installs it,
  # smoke-tests the installed host, completes onboarding in the installed window
  # and uninstalls it — with the signing identities applied when this release
  # requires them, and refusing when they are required and absent.
  #
  # The venv-based payload installers (`scripts/build_installer.py`) are no
  # longer published: they need a system Python on the owner's machine
  # (docs/adr/ADR-0003-desktop-distribution.md).
  desktop:
    name: Desktop packages
    needs: plan
    uses: ./.github/workflows/desktop-package.yml
    with:
      version: ${{ inputs.version }}
      channel: ${{ inputs.channel }}
      signed: ${{ inputs.signing != 'skip' }}
      unsigned_os: ${{ inputs.signing == 'require-except-macos' && 'macos' || '' }}
    secrets: inherit

  # ── 4. The channel index, signed once over every target ────────────────
  channel:
    name: Channel index
    needs: [plan, desktop]
    # Unsigned manual runs end after their per-target artifacts are uploaded.
    # A channel is an updater trust root, so it exists only for signed builds.
    if: inputs.signing != 'skip'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package
        run: python -m pip install -e .
      - name: Collect every target's installers
        # actions/download-artifact v7.0.0, the first release on Node 24 (v5 and v6 run on Node 20)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node 24)
        with:
          pattern: desktop-*
          path: collected
      - name: Flatten into one release directory
        run: |
          mkdir -p dist
          find collected -type f \( -name 'Raiker-*' -o -name 'SHA256SUMS-*.txt' \) -exec cp {} dist/ \;
          ls -la dist
      - name: Refuse an incomplete release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, sys
          from raiker.app.desktop_release import DESKTOP_TARGETS, artifact_names
          version = os.environ["VERSION"]
          missing = [
              name
              for target in DESKTOP_TARGETS
              for name in artifact_names(version, target.target_id, signed=True).values()
              if not (pathlib.Path("dist") / name).is_file()
              or not (pathlib.Path("dist") / f"{name}.manifest.json.sig").is_file()
          ]
          if missing:
              sys.exit("refused: missing or unsigned: " + ", ".join(missing))
          print("every target's signed installers are present")
          PY
      - name: Build and sign the channel index
        env:
          RAIKER_RELEASE_SIGNING_KEY: ${{ secrets.RAIKER_RELEASE_SIGNING_KEY }}
          # DEC-21 Updates — passed through the environment, never spliced into
          # the script, so the owner's text cannot become shell.
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$RAIKER_RELEASE_SIGNING_KEY" ]; then
            echo "refused: RAIKER_RELEASE_SIGNING_KEY is not configured, so the" >&2
            echo "channel index cannot be signed and an installed Raiker would" >&2
            echo "have nothing to verify." >&2
            exit 1
          fi
          raiker-release desktop-channel \
            --version "${{ inputs.version }}" \
            --channel "${{ inputs.channel }}" \
            --dir dist \
            --notes "$RELEASE_NOTES"
      # DEC-17 step 10 / DEC-24 step 7 — the SBOM is published beside the
      # artifacts and bound to them, the commit and the lock in a provenance
      # record signed with the release key. `verify` below checks it.
      # The SBOM reads web/package-lock.json and the installed Python
      # distributions, so it needs no node_modules.
      - name: Generate the SBOM for this release
        run: python scripts/licensing_check.py --sbom "dist/raiker-${{ inputs.version }}.spdx.json"
      - name: Bind the artifacts, commit, lock and SBOM in signed provenance
        env:
          RAIKER_RELEASE_SIGNING_KEY: ${{ secrets.RAIKER_RELEASE_SIGNING_KEY }}
        run: |
          raiker-release provenance \
            --version "${{ inputs.version }}" \
            --channel "${{ inputs.channel }}" \
            --dir dist \
            --commit "${{ github.sha }}" \
            --sbom "dist/raiker-${{ inputs.version }}.spdx.json" \
            --lock uv.lock \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # The same verification an installed Raiker performs, run here, so a
      # release that its own updater would refuse never leaves this workflow.
      - name: Verify the release the way the product will
        env:
          RAIKER_RELEASE_SIGNING_KEY: ${{ secrets.RAIKER_RELEASE_SIGNING_KEY }}
        run: raiker-release verify --dir dist --channel "desktop-${{ inputs.channel }}"
      - name: Publish the release public key alongside it
        env:
          RAIKER_RELEASE_SIGNING_KEY: ${{ secrets.RAIKER_RELEASE_SIGNING_KEY }}
        run: |
          python - <<'PY' > dist/release-public-key.txt
          import os
          from raiker.app.release import public_key_of
          print(public_key_of(bytes.fromhex(os.environ["RAIKER_RELEASE_SIGNING_KEY"])).hex())
          PY
          echo "pin with: raiker-app update --channel-url <url of desktop-${{ inputs.channel }}.json> --channel-key $(cat dist/release-public-key.txt)"
      # CI-5 — the evidence record, written from this run's own outputs. A
      # missing SBOM, provenance or channel signature fails the release here.
      - name: Write RELEASE_EVIDENCE.md
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SIGNING: ${{ inputs.signing }}
        run: |
          cp desktop/signing/raiker-linux-signing-key.asc dist/
          python scripts/release_evidence.py --dir dist --version "$VERSION" --channel "$CHANNEL" \
            --signing "$SIGNING" --out dist/RELEASE_EVIDENCE.md
          cat dist/RELEASE_EVIDENCE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the signed channel
        # actions/upload-artifact v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node 24)
        with:
          name: release-channel
          path: dist
          if-no-files-found: error
          retention-days: 30

  # ── 5. Publishing, only when asked and only when signed ────────────────
  publish:
    name: Draft release
    needs: [plan, channel]
    if: inputs.publish && inputs.signing != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing: the OIDC token names this workflow to Sigstore, and
      # the attestation is stored with the repository.
      id-token: write
      attestations: write
    steps:
      - name: Collect the signed channel
        # actions/download-artifact v7.0.0, the first release on Node 24 (v5 and v6 run on Node 20)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node 24)
        with:
          name: release-channel
          path: dist
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
        with:
          path: source
      - name: Choose one installer per platform
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python source/scripts/select_release_assets.py --version "$VERSION" --from dist --to assets
          # IN-3 — the Linux downloads carry their detached signatures, and the
          # public halves owners verify them with travel with the release.
          for file in assets/*.AppImage; do
            test -f "dist/$(basename "$file").asc" && cp "dist/$(basename "$file").asc" assets/
          done
          cp source/desktop/signing/raiker-linux-signing-key.asc assets/
          cp source/desktop/signing/release-public-key.txt assets/
          cp dist/RELEASE_EVIDENCE.md assets/
      # Keyless signing with this repository's GitHub identity: Sigstore
      # binds each file's digest to this workflow, commit and run, and the
      # signature is logged publicly. Owners check a download with
      # `gh attestation verify <file> --repo sharRahul/Raiker`; the
      # next step does exactly that before the draft exists.
      - name: Sign the downloads with the repository's GitHub identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/Raiker-*
      - name: Verify the signatures the way an owner will
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in assets/Raiker-*; do
            gh attestation verify "$file" --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          done
      # `gh` ships on the runner, so the draft needs no third-party action.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SIGNING: ${{ inputs.signing }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download and install

          | Your computer | Download |
          |---|---|
          | Windows 10/11 (Intel or AMD) | `Raiker-<version>-windows-x86_64-setup.exe` |
          | Windows 11 on Arm | `Raiker-<version>-windows-arm64-setup.exe` (the x86-64 program, runs under Windows' built-in emulation) |
          | Mac with Apple silicon | `Raiker-<version>-macos-arm64.dmg` |
          | Linux (x86-64) | `Raiker-<version>-linux-x86_64.AppImage` |
          | Linux (ARM64) | `Raiker-<version>-linux-arm64.AppImage` |

          Run the installer and follow the guided setup. No Python, Node.js or
          terminal is needed. Each installer was built, installed, smoke-tested and
          uninstalled on its own platform's runner before this draft was made.

          ## Verifying

          Every download is signed with this repository's GitHub identity
          (Sigstore build provenance). Check one before installing:

              gh attestation verify <file> --repo sharRahul/Raiker

          Linux downloads also carry a detached GPG signature (`.asc`). Check one
          with the published key (fingerprint
          `248B C529 09AA AAFD FA77  EF0D 0BFF AD3B 8A20 24C1`):

              gpg --import raiker-linux-signing-key.asc
              gpg --verify <file>.AppImage.asc <file>.AppImage

          The signed update index, per-installer manifests, SBOM, provenance and
          checksums are in this run's `release-channel` workflow artifact, for
          hosting at the update channel URL.
          NOTES
          if [ "$SIGNING" = "require-except-macos" ]; then
            cat >> notes.md <<'NOTES'

          ## Platform signatures in this beta

          - **Windows** is Authenticode-signed with Raiker's own beta certificate
            (`CN=Raiker (self-signed beta)`, thumbprint
            `1300BFD1A0894EC033198426144784450AF70C8A`). Windows checks that the
            installer has not changed since it was signed, but it does not know
            this publisher, so SmartScreen still shows *Unknown publisher*:
            choose **More info → Run anyway**. Settings › About & updates says
            *Signed by Raiker (self-signed)*.
          - **Linux** packages are signed with the GPG key above.
          - **macOS** is not signed or notarised yet (no Apple Developer ID).
            Open it with right-click → **Open** the first time.
          NOTES
          else
            echo >> notes.md
            echo "These builds are also signed with the platform identities." >> notes.md
          fi
          {
            echo
            echo '## SHA-256'
            echo
            echo '```'
            cat assets/SHA256SUMS.txt
            echo '```'
          } >> notes.md
          gh release create "v${{ inputs.version }}" assets/Raiker-* assets/raiker-linux-signing-key.asc assets/release-public-key.txt assets/RELEASE_EVIDENCE.md \
            --draft --title "Raiker ${{ inputs.version }}" --notes-file notes.md

  # Beta distribution can be a deliberate, unsigned download while platform
  # identities are being provisioned. It never creates a channel index, so an
  # installed beta cannot silently accept unsigned updates.
  beta_publish:
    name: Draft beta download
    needs: [plan, desktop]
    if: always() && inputs.publish && inputs.channel == 'beta' && inputs.signing == 'skip' && needs.plan.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing: the OIDC token names this workflow to Sigstore, and
      # the attestation is stored with the repository.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0 (Node 24)
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Collect the desktop artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node 24)
        with:
          pattern: desktop-*
          path: collected
      - name: Choose one installer per platform
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          find collected -type f -name 'Raiker-*' -exec cp {} dist/ \;
          python scripts/select_release_assets.py --version "$VERSION" --from dist --to assets
      # Keyless signing with this repository's GitHub identity: Sigstore
      # binds each file's digest to this workflow, commit and run, and the
      # signature is logged publicly. Owners check a download with
      # `gh attestation verify <file> --repo sharRahul/Raiker`; the
      # next step does exactly that before the draft exists.
      - name: Sign the downloads with the repository's GitHub identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/Raiker-*
      - name: Verify the signatures the way an owner will
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in assets/Raiker-*; do
            gh attestation verify "$file" --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          done
      - name: Create the beta draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          cat > notes.md <<'NOTES'
          ## Beta download and install

          One download per platform:

          | Your computer | Download |
          |---|---|
          | Windows 10/11 (Intel or AMD) | `Raiker-<version>-windows-x86_64-setup.exe` |
          | Windows 11 on Arm | `Raiker-<version>-windows-arm64-setup.exe` (the x86-64 program, runs under Windows' built-in emulation) |
          | Mac with Apple silicon | `Raiker-<version>-macos-arm64.dmg` |
          | Linux (x86-64) | `Raiker-<version>-linux-x86_64.AppImage` |
          | Linux (ARM64) | `Raiker-<version>-linux-arm64.AppImage` |

          This beta was built without platform signing identities, and each
          installed copy says so in Settings. On macOS, open the `.dmg` and drag
          `Raiker.app` to Applications; macOS may require Control-click → Open
          because no Apple Developer ID certificate or notarization was
          available. Windows SmartScreen may ask you to confirm *Run anyway*.

          Each download is still signed with this repository's GitHub identity
          (Sigstore build provenance), which proves it was built by this
          repository's release workflow from the tagged commit. Check one
          before installing:

              gh attestation verify <file> --repo sharRahul/Raiker

          Beta downloads are not added to Raiker's automatic update channel.

          ## Maintainer notes

          NOTES
          printf '%s\n' "$RELEASE_NOTES" >> notes.md
          {
            echo
            echo '## SHA-256'
            echo
            echo '```'
            cat assets/SHA256SUMS.txt
            echo '```'
          } >> notes.md
          gh release create "v${{ inputs.version }}" assets/Raiker-* \
            --draft --title "Raiker ${{ inputs.version }} (beta)" --notes-file notes.md
