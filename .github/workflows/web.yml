name: Web UI

# GCR-15 — the trigger covers what this job is a guard for, not where the files
# are. The web client consumes contracts the backend produces, so a backend-only
# change to a route or a read DTO could merge without the client ever being
# compiled against it or the mocked end-to-end suite being run.
#
# `scripts/check_api_contract.py` closed half of that in the Python job: it
# derives a field-for-field comparison, so a dropped field fails there. What it
# cannot see is everything past the field names — a contract that still matches
# exactly while the page that reads it no longer builds. The paths below are the
# ones that produce those contracts, and `tests/test_web_workflow.py` holds them
# against the checker's own module list so the two cannot drift.
on:
  pull_request:
    paths: &contract_paths
      - "web/**"
      - "raiker/api/**"
      - "raiker/control/dtos.py"
      - "raiker/control/dashboard.py"
      - "raiker/control/service.py"
      - "raiker/control/web_read_models.py"
      - "scripts/check_api_contract.py"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths: *contract_paths

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node
        # actions/setup-node v5.0.0 (Node 24 runtime)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      # BUG-41 — the mocked end-to-end suite runs against the build produced by
      # the step above. It needs no credential and no network: every API call is
      # answered from a fixture inside the spec. The `live` project, which drives
      # a real host holding real provider keys, is deliberately not run here —
      # CI has no key, and a suite that cannot really pass must not report that
      # it did.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end (mocked)
        run: npm run test:e2e:mocked
