name: Web UI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

defaults:
  run:
    working-directory: apps/web

jobs:
  web:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v5.0.1 (Node 24 runtime)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node
        # actions/setup-node v5.0.0 (Node 24 runtime)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      # BUG-41 — the mocked end-to-end suite runs against the build produced by
      # the step above. It needs no credential and no network: every API call is
      # answered from a fixture inside the spec. The `live` project, which drives
      # a real host holding real provider keys, is deliberately not run here —
      # CI has no key, and a suite that cannot really pass must not report that
      # it did.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end (mocked)
        run: npm run test:e2e:mocked
