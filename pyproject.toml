[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raiker"
version = "0.0.0"
description = "Local-first agent runtime core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.110"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
raiker = "raiker.cli.main:main"

[tool.setuptools.packages.find]
include = ["raiker*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tmp", ".raiker", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
mypy_path = "raiker:apps:tests"
