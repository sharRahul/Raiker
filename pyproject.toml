[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raiker"
version = "0.0.0"
description = "Local-first agent runtime core"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "cryptography>=41",
    # Pure-Python, local-only PDF text extraction for uploaded document
    # attachments (web-app task 3). No system deps; extraction fails closed if
    # the import is unavailable.
    "pypdf>=4",
    # Local-owner lock screen. Argon2id password hashing (scrypt fallback lives
    # in the stdlib) and TOTP multi-factor auth. Both are local-only, no egress.
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "sqlcipher3-wheels>=0.5.0",
    "pystray>=0.19.5",
    "Pillow>=10.4",
    # Official client for revision-pinned, filtered, dry-run-capable model downloads.
    "huggingface_hub>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "PyYAML>=6.0", "types-PyYAML>=6.0.12", "httpx2>=2.9", "pyinstaller>=6.10"]

[project.scripts]
raiker = "raiker.cli.main:main"
# The application entry point: detects the OS, keeps data where that platform
# expects it, finds a free loopback port, and opens the default browser.
raiker-app = "apps.api.launcher:main"
# The service entry point, unchanged: explicit workspace, explicit port, and the
# deliberate --allow-public path for reaching Raiker from another machine.
raiker-web = "apps.api.main:main"
# The release build (BUG-44). `.github/workflows/release.yml` calls this on each
# target's own runner; keeping it a console script rather than `python -m` keeps
# the import of `raiker.app` from happening twice.
raiker-release = "raiker.app.release:main"

[tool.setuptools.packages.find]
include = ["raiker*", "apps*"]

[tool.setuptools.package-data]
"raiker.config" = ["*.json"]
# The application icon travels in the wheel so the tray and the installers can
# resolve one file rather than three guesses at a repository path.
"raiker.assets" = ["*.png"]
# The skills Raiker ships live as reviewable directories in the source tree and
# are packed into a *.skill bundle at install time, so every file in one has to
# travel in the wheel — not just the SKILL.md.
"raiker.skills" = ["builtin/*/SKILL.md", "builtin/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tmp", ".raiker", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
# The top-level packages (raiker, apps, tests) all live at the repo root, so
# cwd is the only package base needed. Listing the package dirs themselves as
# path entries made the same __init__.py resolvable under two module names
# (e.g. raiker/api/__init__.py as both "raiker.api" from cwd and "api" from
# the "raiker" entry), triggering "Source file found twice". explicit_package_bases
# makes mypy derive module names from the directory structure, which is what
# lets the PEP-420 namespace packages "apps" and "tests" resolve correctly.
explicit_package_bases = true
