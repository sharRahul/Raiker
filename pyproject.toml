[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raiker"
version = "0.0.0"
description = "Local-first agent runtime core"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "cryptography>=41",
    # Pure-Python, local-only PDF text extraction for uploaded document
    # attachments (web-app task 3). No system deps; extraction fails closed if
    # the import is unavailable.
    "pypdf>=4",
    # Local-owner lock screen. Argon2id password hashing (scrypt fallback lives
    # in the stdlib) and TOTP multi-factor auth. Both are local-only, no egress.
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    # RAIKER-2025 — the floor is 0.5.6 because that is where this wheel gained
    # FTS5, and Raiker's two text indexes are FTS5.
    #
    # Measured, not assumed, across every published version:
    #
    #     0.5.2  SQLite 3.44.2  no such module: fts5
    #     0.5.4  SQLite 3.46.1  no such module: fts5
    #     0.5.6  SQLite 3.50.4  ENABLE_FTS5
    #     0.5.7  SQLite 3.51.1  ENABLE_FTS5
    #
    # This is also the answer to a question the plan documents got wrong for
    # months. They recorded that "the SQLCipher distribution Raiker ships
    # provides FTS4, not FTS5" — which was **true when it was written**, on
    # 0.5.2/0.5.4. The wheel gained FTS5 underneath the claim and nobody
    # re-measured, so a workaround stayed designed around a constraint that had
    # already lifted.
    #
    # The old floor, `>=0.5.0`, was worse than nominal: 0.5.0 was never
    # published at all (PyPI starts at 0.5.2), so the specifier resolved
    # happily to a wheel with no FTS5 and a fresh install could silently land
    # on recency-ordered search. The runtime probe still handles that case
    # honestly, but a dependency floor should not permit it.
    "sqlcipher3-wheels>=0.5.6",
    "pystray>=0.19.5",
    "Pillow>=10.4",
    # Official client for revision-pinned, filtered, dry-run-capable model downloads.
    "huggingface_hub>=1.25,<2",
    # Filesystem change notifications for indexed attached project roots.
    # `watchfiles` and not `watchdog` because it is async-native: its `awatch`
    # is an async iterator, so the watcher joins the host's existing lifespan
    # workers directly instead of needing a thread bridged back into the loop.
    "watchfiles>=0.21",
    # Apple's local MLX runtime. The marker keeps non-Apple installations clean;
    # the UI still explains that MLX serving is available only on Apple silicon.
    "mlx-lm>=0.31.3; platform_system == 'Darwin'",
]

[project.optional-dependencies]
# `httpx2` is not a typo for `httpx` and not a duplicate of it. Starlette 1.6's
# TestClient imports `httpx2` first and warns that using `httpx` with it is
# deprecated, so this is what the test client needs; the `httpx>=0.27` in the
# runtime dependencies above is Raiker's own HTTP client, which is a different
# thing that happens to share a name.
#
# The floors are not decorative. `ruff>=0.6` admitted **110 published
# releases** of a ~10 MB binary wheel, and a pip that backtracks downloads the
# whole wheel to read metadata it then throws away — so the width of the floor
# is the width of the worst case, in megabytes. `>=0.15` admits 30. Nothing in
# `[tool.ruff]` below uses a rule or setting older releases lacked, so the wide
# floor bought nothing and paid for that worst case.
dev = ["pytest>=8", "ruff>=0.15", "mypy>=1.10", "PyYAML>=6.0", "types-PyYAML>=6.0.12", "httpx2>=2.9", "pyinstaller>=6.10"]

[project.scripts]
raiker = "raiker.cli.main:main"
# The application entry point: detects the OS, keeps data where that platform
# expects it, finds a free loopback port, and opens the default browser.
raiker-app = "apps.api.launcher:main"
# The service entry point, unchanged: explicit workspace, explicit port, and the
# deliberate --allow-public path for reaching Raiker from another machine.
raiker-web = "apps.api.main:main"
# The release build (BUG-44). `.github/workflows/release.yml` calls this on each
# target's own runner; keeping it a console script rather than `python -m` keeps
# the import of `raiker.app` from happening twice.
raiker-release = "raiker.app.release:main"
raiker-command-supervisor = "raiker.execution.commands.remote_supervisor:main"

[tool.setuptools.packages.find]
include = ["raiker*", "apps*"]

[tool.setuptools.package-data]
"raiker.config" = ["*.json"]
# The application icon travels in the wheel so the tray and the installers can
# resolve one file rather than three guesses at a repository path.
"raiker.assets" = ["*.png"]
# The skills Raiker ships live as reviewable directories in the source tree and
# are packed into a *.skill bundle at install time, so every file in one has to
# travel in the wheel — not just the SKILL.md.
"raiker.skills" = ["builtin/*/SKILL.md", "builtin/*/*/*"]
"raiker.native" = ["*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tmp", ".raiker", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
# The top-level packages (raiker, apps, tests) all live at the repo root, so
# cwd is the only package base needed. Listing the package dirs themselves as
# path entries made the same __init__.py resolvable under two module names
# (e.g. raiker/api/__init__.py as both "raiker.api" from cwd and "api" from
# the "raiker" entry), triggering "Source file found twice". explicit_package_bases
# makes mypy derive module names from the directory structure, which is what
# lets the PEP-420 namespace packages "apps" and "tests" resolve correctly.
explicit_package_bases = true
